# Logback(LogstashTcpSocketAppender) -> Logstash -> Elasticsearch
#
# 애플리케이션은 두 개의 TCP Appender 로 접속한다.
#   log_type = "api_access"  : ApiAccessLogWriter 가 남기는 상태 코드 분류 로그
#   log_type = "application" : 그 밖의 일반 애플리케이션 로그
# 두 종류를 서로 다른 인덱스로 갈라서 Kibana 에서 섞이지 않게 한다.

input {
    tcp {
        port => 5044
        # Appender 는 JSON 을 개행으로 이어 붙여 보내므로 json 이 아니라 json_lines 여야 한다.
        codec => json_lines { charset => "UTF-8" }
    }
}

filter {
    if [log_type] == "api_access" {
        mutate {
            convert => {
                "http_status" => "integer"
                "duration_ms" => "integer"
            }
            add_field => { "[@metadata][target_index]" => "api-access-logs" }
        }

        # status_class 없이 들어온 로그(예전 포맷)도 상태 코드로 대역을 복원해준다.
        if ![status_class] and [http_status] {
            if [http_status] >= 500 {
                mutate { add_field => { "status_class" => "5XX" "status_category" => "SERVER_ERROR" } }
            } else if [http_status] >= 400 {
                mutate { add_field => { "status_class" => "4XX" "status_category" => "CLIENT_ERROR" } }
            } else if [http_status] >= 300 {
                mutate { add_field => { "status_class" => "3XX" "status_category" => "REDIRECTION" } }
            } else if [http_status] >= 200 {
                mutate { add_field => { "status_class" => "2XX" "status_category" => "SUCCESS" } }
            } else {
                mutate { add_field => { "status_class" => "1XX" "status_category" => "INFORMATIONAL" } }
            }
        }

        # Kibana 에서 바로 필터링할 수 있게 눈에 띄는 요청에 태그를 붙인다.
        if [status_category] == "SERVER_ERROR" {
            mutate { add_tag => [ "server_error" ] }
        } else if [status_category] == "CLIENT_ERROR" {
            mutate { add_tag => [ "client_error" ] }
        }

        if [duration_ms] and [duration_ms] > 1000 {
            mutate { add_tag => [ "slow_request" ] }
        }
    } else {
        mutate { add_field => { "[@metadata][target_index]" => "application-logs" } }
    }

    mutate { remove_field => [ "@version", "port" ] }
}

output {
    elasticsearch {
        hosts => [ "${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}" ]
        index => "%{[@metadata][target_index]}-%{+YYYY.MM.dd}"
        # 매핑은 elk/index-template-*.json 으로 미리 올려둔다.
        manage_template => false
    }

    # 파이프라인이 의심스러울 때 주석을 풀면 Logstash 콘솔에서 문서 원본을 볼 수 있다.
    # stdout { codec => rubydebug }
}
